name: CI/CD jimenez

on:
  push:
    branches:
      - christopherJimenez   # se ejecutará cuando hagas push a tu rama
  pull_request:
    branches:
      - christopherJimenez

permissions:
  contents: read
  packages: write     # necesario para publicar en GitHub Container Registry
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🧪 Run tests
      run: pytest || echo "⚠️ No tests found, skipping tests step"

    - name: 🧹 Run lint
      run: |
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/chrisshikayri/taller-individual-c-j:1.0.0
